configuration:
  secret:
    name: Segredo de cópias
    description: Só para as casas instaladas antes da 0.3.0, ou para substituir o segredo à mão. Gerado na consola Domnex (Instalações → Segredo cópias); mostra-se uma vez, e gerar outro substitui este. Com o código de instalação, fica vazio.
  code:
    name: Código de instalação
    description: "Gerado na consola Domnex (Frota → Nova casa). Usa-se uma vez: o agente regista a casa e guarda o segredo sozinho."
