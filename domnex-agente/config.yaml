# O agente local da Domnex: entrega a cópia diária ao cofre e mantém o
# batimento com a consola (versão do HA, reiniciar/atualizar à distância).
# Instala-se pela loja de add-ons do Home Assistant, com o repositório
# github.com/Luispinto26/domnex-addons adicionado — é daqui que as casas
# recebem as atualizações do agente. (Até à 0.2.3 copiava-se a pasta para
# /addons em cada casa; o DOCS.md diz como mudar uma casa dessas para aqui.)
#
# O SLUG FICA `omnex_backup` E NÃO SE MUDA. É por ele que o Home Assistant
# reconhece o add-on: com um slug novo, as casas já instaladas não veriam
# uma atualização — veriam um add-on diferente, com a configuração vazia
# (adeus segredo das cópias) e o /data vazio (adeus marca da última cópia,
# logo reenvio de tudo). O nome visível é que é a marca, e esse é Domnex.
# A passagem de `local_omnex_backup` para `<hash deste repositório>_omnex_backup`
# é exatamente essa troca, uma vez e à mão, nas casas que vinham de /addons.
name: Domnex Agente
version: "0.2.4"
slug: omnex_backup
description: Cópias de segurança no cofre da Domnex e gestão remota pela consola
url: https://github.com/Luispinto26/domnex-addons
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# O batimento fala com o Supervisor: `core/info` para a versão, e
# `core/restart`/`core/update` quando a consola os pede — daí o papel
# manager, o mínimo que pode reiniciar e atualizar o Core.
hassio_api: true
hassio_role: manager
map:
  - backup:ro
  - homeassistant_config:ro
options:
  secret: ""
schema:
  secret: str
